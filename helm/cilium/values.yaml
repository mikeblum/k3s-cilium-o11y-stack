# Cilium Helm values for a single-node k3s cluster.
#
# k8sServiceHost and k8sServicePort are not here: install.sh passes them with
# --set, because the API server address is the one value that varies per host.

kubeProxyReplacement: true

# L2 announcements so LoadBalancer services get a real LAN IP
l2announcements:
  enabled: true
externalIPs:
  enabled: true

# Cilium's built-in Envoy proxy, which backs L7 policy and Gateway API.
# Separate from the Envoy Gateway controller in envoy-gateway-system.
envoy:
  enabled: true

gatewayAPI:
  enabled: true

# Hubble: network observability. The metrics below are scraped by the OTel
# Collector, not Prometheus (k8s/o11y/values/otel-collector.yaml).
hubble:
  enabled: true
  relay:
    enabled: true
    prometheus:
      enabled: true
      port: 9965
  ui:
    enabled: true
  metrics:
    enableOpenMetrics: true
    enabled:
      - dns
      - drop
      - tcp
      - flow
      - port-distribution
      - icmp
      - "httpV2:exemplars=true;labelsContext=source_ip,source_namespace,source_workload,destination_ip,destination_namespace,destination_workload,traffic_direction"

# Agent metrics. The agent runs hostNetwork, so this is :9962 on the node
# itself — handy for a curl when the collector's scrape job looks wrong.
prometheus:
  enabled: true
  port: 9962

operator:
  replicas: 1        # single node, so a second replica would never schedule
  prometheus:
    enabled: true
    port: 9963

# eBPF-based traffic shaping.
bandwidthManager:
  enabled: true

hostFirewall:
  enabled: false     # turn on once node-level policies exist
