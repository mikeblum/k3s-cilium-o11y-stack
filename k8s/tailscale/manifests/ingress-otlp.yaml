# OTLP ingest from outside the cluster (workstations, CI) at
# https://otlp.<tailnet>.ts.net. In-cluster workloads use
# otelcol.o11y.svc.cluster.local:4317. See k8s/o11y/CLAUDE-CODE-TELEMETRY.md.
#
# Senders need OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf — an Ingress proxies
# HTTP, so 4317 (gRPC) is not reachable through it. Exposing gRPC would mean a
# second, Layer 3 proxy: a Service with loadBalancerClass: tailscale, which
# DNATs raw TCP. Auth is tailnet membership, same as Grafana. First connection
# takes 30-60s while Let's Encrypt issues the cert.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: otlp-ts
  namespace: o11y
  annotations:
    tailscale.com/tags: "tag:k8s-ingress"
spec:
  ingressClassName: tailscale
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: otelcol
                port:
                  number: 4318
  tls:
    - hosts:
        - otlp
