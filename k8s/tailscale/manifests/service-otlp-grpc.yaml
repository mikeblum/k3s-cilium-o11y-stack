# OTLP/gRPC ingest from outside the cluster, at otlp-grpc.<tailnet>.ts.net:4317.
# The HTTP half of the same story lives in ingress-otlp.yaml.
#
# A Service rather than an Ingress: an Ingress is Layer 7 — `tailscale serve`,
# an HTTP reverse proxy — and gRPC needs HTTP/2 carried end to end, trailers
# included. `loadBalancerClass: tailscale` selects the operator's Layer 3 proxy
# instead, which DNATs raw TCP and does not inspect the protocol.
#
# Cilium's LB IPAM ignores any loadBalancerClass it does not own, so this takes
# no address from lan-pool despite being type LoadBalancer.
#
# No TLS here: Layer 3 has no Let's Encrypt cert to terminate, so senders set
# OTEL_EXPORTER_OTLP_INSECURE=true. WireGuard is the encryption and tailnet
# membership the auth — the same trust model as the HTTPS ingress, minus a
# certificate. Traffic arrives from a ts-* proxy pod, which the collector's
# k8s_attributes exclude already covers.
apiVersion: v1
kind: Service
metadata:
  name: otlp-grpc-ts
  namespace: o11y
  annotations:
    tailscale.com/tags: "tag:k8s-ingress"
    tailscale.com/hostname: "otlp-grpc"
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app.kubernetes.io/instance: otelcol
    app.kubernetes.io/name: opentelemetry-collector
    component: agent-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
