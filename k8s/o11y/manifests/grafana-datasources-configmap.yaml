apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: o11y
  labels:
    grafana_datasource: "1"   # picked up by Grafana sidecar
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus-server.o11y.svc.cluster.local
        isDefault: false
        # Cilium pre-built dashboards reference this datasource by uid "prometheus" —
        # do not rename it.

      - name: ClickHouse
        type: grafana-clickhouse-datasource
        uid: clickhouse
        isDefault: true
        jsonData:
          # Stable ClusterIP from manifests/clickhouse-service.yaml, not the
          # operator's derived <cr-name>-clickhouse-headless.
          host: clickhouse-server.o11y.svc.cluster.local
          port: 9000
          protocol: native
          # 'grafana' is the read-only user from manifests/clickhouse-cluster.yaml.
          # The ClickHouse dashboards provisioned in values/grafana.yaml run
          # unqualified queries, so defaultDatabase is what points them at otel.
          username: grafana
          defaultDatabase: otel
          logs:
            defaultDatabase: otel
            defaultTable: otel_logs
            otelEnabled: true
            otelVersion: latest
          traces:
            defaultDatabase: otel
            defaultTable: otel_traces
            otelEnabled: true
            durationUnit: nanoseconds
        secureJsonData:
          # Grafana expands $__env{} in provisioning files; the var is wired to the
          # clickhouse-auth Secret by envValueFrom in values/grafana.yaml.
          password: $__env{CLICKHOUSE_GRAFANA_PASSWORD}
