---
# Drops into /etc/clickhouse-server/users.d/ and overrides the pascaliske
# chart's default-user.xml.
#
# Two dedicated users, one per consumer, instead of sharing `default`:
#
#   otel_writer  — the collector's clickhouse exporter (INSERT + DDL on otel.*)
#   grafana      — the Grafana ClickHouse datasource (read-only)
#
# `default` stays locked to localhost. It was previously opened to ::/0 so
# ch-writer and Grafana could reach it; nothing needs that now, and an
# unauthenticated superuser reachable from any pod is not worth keeping for
# the convenience.
#
# Passwords are SHA-256 hashes here and plaintext in the clickhouse-auth
# Secret (see secrets.example.yaml) — ClickHouse reads this file, the
# collector and Grafana read the Secret. Rotating a password means updating
# BOTH. Regenerate a hash with:
#
#   printf '%s' 'your-password' | sha256sum
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-users-override
  namespace: o11y
data:
  00-network-override.xml: |
    <clickhouse>
      <users>
        <!-- Lock default user back to localhost — dedicated users handle all app access -->
        <default>
          <networks>
            <ip>127.0.0.1</ip>
            <ip>::1</ip>
          </networks>
        </default>

        <!-- Grafana datasource: read-only across the otel database -->
        <grafana>
          <password_sha256_hex>3e1a5813cc0d6ca949f29a020315cfc6da9aef1597247a867f27270a203a23ff</password_sha256_hex>
          <networks><ip>::/0</ip></networks>
          <profile>readonly</profile>
          <quota>default</quota>
        </grafana>

        <!-- OTel Collector OTLP ingest: INSERT + CREATE TABLE on otel.* -->
        <otel_writer>
          <password_sha256_hex>a09873de70beaa98d80b2ebda340b1c0f51045446337b3b28b3ac25b1f6aa095</password_sha256_hex>
          <networks><ip>::/0</ip></networks>
          <profile>default</profile>
          <quota>default</quota>
          <databases>
            <otel/>
          </databases>
        </otel_writer>
      </users>
    </clickhouse>
