---
# Drops into /etc/clickhouse-server/users.d/ and overrides the pascaliske
# chart's default-user.xml.
#
# Two dedicated users, one per consumer, instead of sharing `default`:
#
#   otel_writer  — the collector's clickhouse exporter (INSERT + DDL on otel.*)
#   grafana      — the Grafana ClickHouse datasource (read-only)
#
# `default` stays locked to localhost. Keep it that way — an unauthenticated
# superuser reachable from any pod is not worth the convenience.
#
# Passwords are SHA-256 hashes here and plaintext in the clickhouse-auth
# Secret (see secrets.example.yaml) — ClickHouse reads this file, the
# collector and Grafana read the Secret. Rotating a password means updating
# BOTH. Regenerate a hash with:
#
#   printf '%s' 'your-password' | sha256sum
#
# The chart mounts this ConfigMap with subPath, which kubelet never refreshes.
# ClickHouse hot-reloads users.d, but it will never see an edit here until the
# pod is replaced — `kubectl apply` alone is a no-op:
#
#   kubectl rollout restart statefulset/clickhouse -n o11y
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-users-override
  namespace: o11y
data:
  00-network-override.xml: |
    <clickhouse>
      <profiles>
        <!-- Read-only for a BI client, not ClickHouse's built-in `readonly`
             profile. That one is readonly=1, which also forbids changing any
             setting — and the Grafana ClickHouse plugin sends max_execution_time
             with every query, so each panel fails with:
               Code: 164 ... Cannot modify 'max_execution_time' in readonly mode
             readonly=2 permits setting changes while still rejecting INSERT and
             DDL. -->
        <readonly_grafana>
          <readonly>2</readonly>
        </readonly_grafana>
      </profiles>

      <users>
        <!-- Lock default user back to localhost — dedicated users handle all app access -->
        <default>
          <networks>
            <ip>127.0.0.1</ip>
            <ip>::1</ip>
          </networks>
        </default>

        <!-- Grafana datasource: read-only across the otel database -->
        <grafana>
          <password_sha256_hex>3e1a5813cc0d6ca949f29a020315cfc6da9aef1597247a867f27270a203a23ff</password_sha256_hex>
          <networks><ip>::/0</ip></networks>
          <profile>readonly_grafana</profile>
          <quota>default</quota>
        </grafana>

        <!-- OTel Collector OTLP ingest: INSERT + CREATE TABLE on otel.* -->
        <otel_writer>
          <password_sha256_hex>a09873de70beaa98d80b2ebda340b1c0f51045446337b3b28b3ac25b1f6aa095</password_sha256_hex>
          <networks><ip>::/0</ip></networks>
          <profile>default</profile>
          <quota>default</quota>
          <databases>
            <otel/>
          </databases>
        </otel_writer>
      </users>
    </clickhouse>
