# Grafana 13.0.1 — Grafana 13 stable (security-patched)
#
# Auth: Tailscale membership is the auth boundary — only tailnet members can
# reach this instance — so anonymous access is enabled and the login form is
# hidden. Anonymous users land in the Viewer role; anyone who does sign in
# (admin credentials still work via the API / a direct /login URL) is
# auto-assigned Admin.

image:
  tag: "13.0.1"

grafana.ini:
  analytics:
    check_for_updates: false      # avoid outbound call on every load; this is an air-gapped homelab
    check_for_plugin_updates: false
    reporting_enabled: false
  auth:
    disable_login_form: true      # nothing to log into — the tailnet is the boundary
  auth.anonymous:
    enabled: true
    org_role: Viewer
  users:
    auto_assign_org_role: Admin   # applies to real logins only, NOT anonymous users

# Version-pinned to stay in lockstep with the dashboards below, which are
# fetched from this plugin's repo at the same tag. Unpinned, Grafana installs
# whatever the catalog serves at pod start and the two can drift apart.
# 4.20 is what added the three out-of-box OpenTelemetry dashboards.
plugins:
  - grafana-clickhouse-datasource 4.20.0

sidecar:
  datasources:
    enabled: true   # auto-loads datasources from ConfigMaps with grafana_datasource=1 label
  # For dashboards that ship as JSON rather than a grafana.com gnetId — they
  # arrive as ConfigMaps labelled grafana_dashboard=1, with the target folder in
  # a grafana_folder annotation. k8s/otel-demo uses this; the gnetId dashboards
  # below keep using the file-based providers.
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    folderAnnotation: grafana_folder
    provider:
      foldersFromFilesStructure: true

  # Loads dashboards from ConfigMaps labelled grafana_dashboard=1 in this
  # namespace — how the otel-demo ships its spanmetrics dashboard. Distinct from
  # the `dashboards:` block below, which downloads JSON at pod startup: this one
  # picks up whatever is applied to the cluster, without a Grafana restart.
  # The grafana_folder annotation on the ConfigMap names the target folder, which
  # only takes effect with foldersFromFilesStructure.
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    folderAnnotation: grafana_folder
    provider:
      foldersFromFilesStructure: true

# Supplies $__env{CLICKHOUSE_GRAFANA_PASSWORD} to the provisioned ClickHouse
# datasource in manifests/grafana-datasources-configmap.yaml.
envValueFrom:
  CLICKHOUSE_GRAFANA_PASSWORD:
    secretKeyRef:
      name: clickhouse-auth
      key: GRAFANA_PASSWORD

persistence:
  enabled: true
  size: 5Gi

initChownData:
  enabled: false  # PVC already owned by uid 472 from initial install; chown fails on re-deploy

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: cilium
        folder: Cilium
        type: file
        disableDeletion: false
        allowUiUpdates: true   # allow saving tweaks to provisioned dashboards in this homelab
        options:
          path: /var/lib/grafana/dashboards/cilium
      - name: otel
        folder: OTel
        type: file
        disableDeletion: false
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards/otel
      - name: host
        folder: Host
        type: file
        disableDeletion: false
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards/host
      - name: clickhouse
        folder: ClickHouse
        type: file
        disableDeletion: false
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards/clickhouse

# Dashboards fetched at pod startup by the download-dashboards init container.
# Top-level key must match a provider name above; each entry becomes
# /var/lib/grafana/dashboards/<provider>/<key>.json.
#
# Renaming a key strands the old JSON on the PVC. Two files sharing a dashboard
# UID make Grafana revoke write permission for the whole provider — rm the stale
# file from /var/lib/grafana/dashboards/<provider>/.
#
# Entries with `gnetId` come from grafana.com and are PromQL against the
# `prometheus` datasource. Entries with `url` come from the ClickHouse datasource
# plugin, which ships its dashboards in-repo rather than publishing them to
# grafana.com — the plugin UI offers them under Connections → Data Sources →
# ClickHouse → Dashboards, and we provision the same JSON so they survive a
# reinstall. The tag in those URLs is pinned; bump it with the plugin.
dashboards:
  cilium:
    # Cilium 1.12 dashboards — metric names are stable through 1.17.
    # Published by Isovalent: https://grafana.com/orgs/isovalent/dashboards
    agent-metrics:
      gnetId: 16611         # Cilium v1.12 Agent Metrics
      datasource:
        - name: DS_PROMETHEUS
          value: prometheus
    operator-metrics:
      gnetId: 16612         # Cilium v1.12 Operator Metrics
      datasource:
        - name: DS_PROMETHEUS
          value: prometheus
    hubble-metrics:
      gnetId: 16613         # Cilium v1.12 Hubble Metrics
      datasource:
        - name: DS_PROMETHEUS
          value: prometheus
    policy-verdicts:
      gnetId: 18015         # Cilium Policy Verdicts (version-agnostic)
      datasource:
        - name: DS_PROMETHEUS
          value: prometheus

  otel:
    # Backed by the collector's own :8888 self-metrics, which the `prometheus`
    # receiver scrapes and remote-writes to Prometheus (see
    # values/otel-collector.yaml).
    otel-collector:
      gnetId: 15983         # OpenTelemetry Collector
      revision: 30
      datasource:
        - name: DS_PROMETHEUS
          value: prometheus

    # The rest of this folder reads OTLP data out of ClickHouse instead —
    # otel_logs and otel_traces, unqualified, so they resolve through the
    # datasource's defaultDatabase (otel). No substitution needed: each one
    # declares a datasource variable that picks the default ClickHouse source.
    logs-explorer:
      url: https://raw.githubusercontent.com/grafana/clickhouse-datasource/v4.20.0/src/dashboards/otel-logs-explorer.json
    traces-explorer:
      url: https://raw.githubusercontent.com/grafana/clickhouse-datasource/v4.20.0/src/dashboards/otel-traces-explorer.json
    service-overview:
      url: https://raw.githubusercontent.com/grafana/clickhouse-datasource/v4.20.0/src/dashboards/otel-service-dashboard.json

  # ClickHouse watching itself, over the `clickhouse` datasource. These read the
  # system log tables — query_log, part_log, metric_log, asynchronous_metric_log,
  # text_log — which the operator turns on for us, and system.parts /
  # system.replicas / system.merges. The `grafana` user is granted SELECT on
  # system.* in manifests/clickhouse-cluster.yaml for exactly this.
  clickhouse:
    query-analysis:
      url: https://raw.githubusercontent.com/grafana/clickhouse-datasource/v4.20.0/src/dashboards/query-analysis.json
    cluster-analysis:
      url: https://raw.githubusercontent.com/grafana/clickhouse-datasource/v4.20.0/src/dashboards/cluster-analysis.json
    data-analysis:
      url: https://raw.githubusercontent.com/grafana/clickhouse-datasource/v4.20.0/src/dashboards/data-analysis.json
    # The only one of the seven with an __inputs block; file-provisioned
    # dashboards get no input prompt, so ${the_datasource} has to be
    # substituted at download time or every panel renders empty.
    system-metrics:
      url: https://raw.githubusercontent.com/grafana/clickhouse-datasource/v4.20.0/src/dashboards/system-dashboards.json
      datasource:
        - name: the_datasource
          value: clickhouse

  host:
    # Panels group by `instance`, which the scrape job relabels to the node name.
    # No `datasource:` unlike the entries above — since revision 42 this
    # dashboard picks a prometheus datasource itself, with no input to substitute.
    node-exporter:
      gnetId: 1860          # Node Exporter Full
      revision: 45
