# OpenTelemetry Collector: the single telemetry pipeline. Two flows, one process:
#
#   apps   --OTLP-->    otlp receiver       --> clickhouse exporter        (logs/traces/metrics)
#   cilium --scrape-->  prometheus/scrape   --> prometheus_remote_write    (infra metrics)
#
# Cilium/Hubble dashboards are PromQL, so those go to Prometheus; everything
# OTLP goes to ClickHouse. See docs/telemetry.md "Metrics live in two stores".
#
# The ONLY place scrape targets belong, because Prometheus's own discovery is off.
# Chart pinned in the Makefile; needs secrets.yaml for the ClickHouse password.

mode: daemonset          # node-local: k8s_attributes filters pods by spec.nodeName
fullnameOverride: otelcol

image:
  repository: otel/opentelemetry-collector-contrib
  tag: "0.157.0"

resources:
  requests:
    cpu: 150m
    memory: 192Mi
  limits:
    cpu: 750m
    memory: 768Mi         # memory_limiter below is a percentage of this

# Grants the ServiceAccount get/list/watch on pods/namespaces/nodes and wires
# the k8s_attributes processor's filter + pod_association blocks.
presets:
  kubernetesAttributes:
    enabled: true

service:
  enabled: true           # ClusterIP `otelcol`, the OTLP endpoint apps target

ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    protocol: TCP
    hostPort: null

  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP
    hostPort: null

  # Legacy wire formats we do not speak. Off, so the ports stay closed.
  jaeger-compact:
    enabled: false
  jaeger-grpc:
    enabled: false
  jaeger-thrift:
    enabled: false
  zipkin:
    enabled: false

extraEnvs:
  - name: CLICKHOUSE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: clickhouse-auth        # see k8s/o11y/secrets.example.yaml
        key: OTEL_WRITER_PASSWORD

config:
  receivers:
    # The only OTLP entry point. In-cluster: otelcol.o11y.svc.cluster.local:4317.
    # Outside: the Tailscale ingress fronts 4318 (k8s/tailscale/manifests/).
    # One receiver for both is safe only because of the k8s_attributes exclude below.
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

    # Cilium/Hubble/operator and host scraping. Kubernetes SD (pod role) rather
    # than localhost. The DaemonSet happens to be node-local today, but SD keeps
    # this correct if the collector ever moves to a Deployment.
    prometheus/scrape:
      config:
        scrape_configs:
          - job_name: cilium-agent
            scrape_interval: 15s
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names: [kube-system]
            relabel_configs:
              - source_labels:
                  - __meta_kubernetes_pod_label_k8s_app
                  - __meta_kubernetes_pod_container_port_name
                regex: cilium;prometheus
                action: keep

          - job_name: hubble
            scrape_interval: 15s
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names: [kube-system]
            relabel_configs:
              - source_labels:
                  - __meta_kubernetes_pod_label_k8s_app
                  - __meta_kubernetes_pod_container_port_name
                regex: cilium;hubble-metrics
                action: keep

          - job_name: cilium-operator
            scrape_interval: 30s
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names: [kube-system]
            relabel_configs:
              - source_labels:
                  - __meta_kubernetes_pod_label_io_cilium_app
                  - __meta_kubernetes_pod_container_port_name
                regex: operator;prometheus
                action: keep

          # The homelab host: CPU, load, memory, disk, filesystem, network.
          # node-exporter lives in its own namespace because o11y's
          # `enforce: baseline` forbids the host access it needs (namespace.yaml).
          # It runs hostNetwork, so relabel `instance` off the node IP to the
          # node name: dashboards key on it, and it survives pod restarts.
          - job_name: node-exporter
            scrape_interval: 15s
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names: [node-exporter]
            relabel_configs:
              - source_labels:
                  - __meta_kubernetes_pod_label_app_kubernetes_io_name
                  - __meta_kubernetes_pod_container_port_name
                regex: prometheus-node-exporter;metrics
                action: keep
              - source_labels: [__meta_kubernetes_pod_node_name]
                target_label: instance

          # Pi-hole: a LAN appliance, not a cluster pod, so there's no
          # kubernetes_sd_configs role for it — plain static_configs by IP.
          - job_name: pihole
            scrape_interval: 15s
            static_configs:
              - targets: ["192.168.86.100:9617"]

          # Placeholder for app metrics scraped over plain Prometheus.
          # Apps that speak OTLP should push to this collector instead; see
          # docs/telemetry.md "Adding a service".
          - job_name: go-services
            scrape_interval: 15s
            static_configs:
              - targets: []

    # Wire formats we do not accept. null removes the chart's defaults.
    jaeger: null
    zipkin: null

  processors:
    batch:
      timeout: 5s
    k8s_attributes:
      # The preset's pod_association falls back to `from: connection`, which
      # resolves tailnet traffic to the Tailscale proxy and would stamp every
      # external payload k8s.namespace.name=tailscale. Excluding the proxy
      # (ts-<ingress>-<hash>-N) drops it from the pod cache so the lookup misses.
      # Same reason jaeger-agent is excluded by default. This replaces that
      # default, which is fine; no Jaeger here.
      #
      # Anything else that forwards OTLP on behalf of other pods needs adding
      # here too, or every payload it relays is attributed to the forwarder.
      exclude:
        pods:
          - name: '^ts-.*'
      extract:
        metadata:
          - k8s.pod.name
          - k8s.namespace.name
          - k8s.node.name
          - k8s.deployment.name
        labels:
          # Pods labelled `app: foo` surface in ClickHouse as service.name=foo.
          - tag_name: service.name
            key: app
            from: pod

  # RED metrics (rate, errors, duration) derived from spans. Any app sending
  # traces gets them for free, with no extra instrumentation.
  #
  # This is a PromQL-shaped signal (rate/histogram_quantile over counters and
  # buckets), so it goes to Prometheus, not ClickHouse, and the split in
  # docs/telemetry.md holds. Emits traces_span_metrics_calls_total and
  # traces_span_metrics_duration_milliseconds_*, the names the OTel Demo's
  # Spanmetrics dashboard queries.
  #
  # Cardinality: one series per service × span name × status code. Instrument
  # span names as low-cardinality routes (/api/products/{id}, not the raw URL);
  # anything that embeds an ID in the span name multiplies series here.
  # Left on the connector's default buckets, which run out to 15s. A custom set
  # topping out at 5s clamped checkout's p95 to exactly 5000ms, because its
  # order pipeline really does run longer and histogram_quantile cannot see past
  # the highest finite bucket.
  connectors:
    spanmetrics: {}

  exporters:
    clickhouse:
      # Stable ClusterIP from manifests/clickhouse-service.yaml, not the
      # operator's derived <cr-name>-clickhouse-headless.
      endpoint: tcp://clickhouse-server.o11y.svc.cluster.local:9000?dial_timeout=10s
      database: otel
      username: otel_writer          # manifests/clickhouse-cluster.yaml
      password: ${env:CLICKHOUSE_PASSWORD}
      logs_table_name: otel_logs
      traces_table_name: otel_traces
      metrics_table_name: otel_metrics
      create_schema: true            # collector owns the DDL; tables made on first write
      ttl: 0                         # keep forever. Applies ONLY to tables the exporter
                                     # creates, so changing retention on existing tables
                                     # also needs:
                                     #   ALTER TABLE otel.<table> MODIFY TTL <expr>
      compress: lz4
      async_insert: true
      timeout: 5s
      retry_on_failure:
        enabled: true
        initial_interval: 5s
        max_interval: 30s
        max_elapsed_time: 300s

    prometheus_remote_write:
      endpoint: http://prometheus-server.o11y.svc.cluster.local/api/v1/write
      timeout: 30s
      retry_on_failure:
        enabled: true
        initial_interval: 5s
        max_interval: 30s
        max_elapsed_time: 300s

    debug: null                      # drop the chart's default stdout exporter

  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, k8s_attributes, batch]
        exporters: [clickhouse, spanmetrics]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, k8s_attributes, batch]
        exporters: [clickhouse]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, k8s_attributes, batch]
        exporters: [clickhouse]

      # Infra metrics -> Prometheus. No k8s_attributes: these carry Prometheus
      # target labels already, and the processor would only add OTel resource
      # attributes the Cilium dashboards do not query.
      # `prometheus` is the chart's own self-metrics receiver (:8888), which
      # backs the OTel Collector dashboard (gnetId 15983) in Grafana.
      metrics/prometheus:
        receivers: [prometheus, prometheus/scrape]
        processors: [memory_limiter, batch]
        exporters: [prometheus_remote_write]

      # Span-derived RED metrics. Separate from metrics/prometheus so the
      # spanmetrics connector is not also fed the scrape jobs above.
      metrics/spanmetrics:
        receivers: [spanmetrics]
        processors: [memory_limiter, batch]
        exporters: [prometheus_remote_write]
