# node-exporter — host metrics for the homelab box: CPU, load, memory, disk,
# filesystem, network. Scraped by the collector, not Prometheus.
#
# Its own release in the `host` namespace, not the Prometheus chart's bundled
# subchart: that lands in o11y, where `enforce: baseline` rejects the host
# access it needs and the DaemonSet silently runs zero pods.
#
# Chart version is pinned in the Makefile.

# Report the host's network and process stats, not a pod sandbox's.
hostNetwork: true
hostPID: true

service:
  # Nothing consumes it: the collector's scrape job discovers pods and matches
  # the container port name, which the DaemonSet sets to `metrics` regardless.
  # The pod is hostNetwork, so :9100 on the node works for a manual curl.
  enabled: false

resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

# Run everywhere, including tainted nodes — an unscraped node is the one whose
# disk fills up.
tolerations:
  - operator: Exists
