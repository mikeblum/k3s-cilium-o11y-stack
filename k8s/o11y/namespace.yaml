apiVersion: v1
kind: Namespace
metadata:
  name: o11y
  labels:
    pod-security.kubernetes.io/enforce: baseline
---
# node-exporter reads the host it runs on, so it needs hostNetwork, hostPID,
# hostPath mounts of /proc, /sys and /, and hostPort 9100 — every one of which
# `baseline` rejects. Rather than relax o11y for one workload, it gets its own
# namespace, and this is the only namespace in the stack allowed host access.
#
# Nothing else belongs here. Anything that does not need to read the host
# belongs in o11y under baseline.
apiVersion: v1
kind: Namespace
metadata:
  name: host
  labels:
    pod-security.kubernetes.io/enforce: privileged
