# ClickHouse credentials — copy to secrets.yaml and fill in.
#
#   cp secrets.example.yaml secrets.yaml
#
# secrets.yaml is gitignored. `make install` applies it before the Helm
# releases, because all three consumers mount keys from it:
#
#   DEFAULT_PASSWORD      -> clickhouse (manifests/clickhouse-cluster.yaml,
#                            settings.defaultUserPassword)
#   OTEL_WRITER_PASSWORD  -> clickhouse + otelcol (values/otel-collector.yaml, extraEnvs)
#   GRAFANA_PASSWORD      -> clickhouse + grafana (values/grafana.yaml, envValueFrom)
#
# ClickHouse reads this Secret directly — the operator wires each key into the
# server container as an env var, and the user definitions reference it with
# '@from_env'. There is no separate hash to keep in sync: change a password
# here, re-apply, and restart the StatefulSet.
#
# Generate passwords with:  openssl rand -base64 24
---
apiVersion: v1
kind: Secret
metadata:
  name: clickhouse-auth
  namespace: o11y
type: Opaque
stringData:
  # default — full access, and what `clickhouse-client` inside the pod uses.
  # The operator leaves this user passwordless unless this key is set.
  DEFAULT_PASSWORD: "replace-me"

  # otel_writer — SELECT/INSERT/ALTER/CREATE on the `otel` database. Used by
  # the collector's clickhouse exporter, which creates the schema on first write.
  OTEL_WRITER_PASSWORD: "replace-me"

  # grafana — read-only across `otel` and the system log tables. Used by the
  # ClickHouse datasource.
  GRAFANA_PASSWORD: "replace-me"
