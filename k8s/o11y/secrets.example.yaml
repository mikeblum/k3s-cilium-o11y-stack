# Stack credentials — copy to secrets.yaml and fill in.
#
#   cp secrets.example.yaml secrets.yaml
#
# secrets.yaml is gitignored. `make install` applies it before the Helm
# releases, because every consumer mounts keys from it:
#
#   DEFAULT_PASSWORD      -> clickhouse (manifests/clickhouse-cluster.yaml,
#                            settings.defaultUserPassword)
#   OTEL_WRITER_PASSWORD  -> clickhouse + otelcol (values/otel-collector.yaml, extraEnvs)
#   GRAFANA_PASSWORD      -> clickhouse + grafana (values/grafana.yaml, envValueFrom)
#   ADMIN_USER/_PASSWORD  -> grafana (values/grafana.yaml, admin.existingSecret)
#
# Note the two different Grafana passwords: GRAFANA_PASSWORD is the read-only
# ClickHouse user the datasource queries with, ADMIN_PASSWORD is the Grafana
# login itself. They are unrelated and should not be set to the same value.
#
# ClickHouse reads this Secret directly — the operator wires each key into the
# server container as an env var, and the user definitions reference it with
# '@from_env'. There is no separate hash to keep in sync: change a password
# here, re-apply, and restart the StatefulSet.
#
# Generate passwords with:  openssl rand -base64 24
---
apiVersion: v1
kind: Secret
metadata:
  name: clickhouse-auth
  namespace: o11y
type: Opaque
stringData:
  # default — full access, and what `clickhouse-client` inside the pod uses.
  # The operator leaves this user passwordless unless this key is set.
  DEFAULT_PASSWORD: "replace-me"

  # otel_writer — SELECT/INSERT/ALTER/CREATE on the `otel` database. Used by
  # the collector's clickhouse exporter, which creates the schema on first write.
  OTEL_WRITER_PASSWORD: "replace-me"

  # grafana — read-only across `otel` and the system log tables. Used by the
  # ClickHouse datasource.
  GRAFANA_PASSWORD: "replace-me"
---
# Grafana's own admin login, kept out of the chart's hands. Without this the
# chart generates a random password into a Secret it owns, which means the
# credential is only ever readable from the cluster and is regenerated if that
# Secret is ever lost.
#
# Grafana authenticates against its SQLite DB on the PVC, not against this
# Secret. It seeds the password from here only when creating a fresh database,
# so rotating is two steps: edit this file, then
#
#   make -C k8s/o11y install && make -C k8s/o11y grafana-admin
#
# Skipping the second step leaves the old password working and the new one
# silently rejected.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-auth
  namespace: o11y
type: Opaque
stringData:
  ADMIN_USER: "admin"
  ADMIN_PASSWORD: "replace-me"
