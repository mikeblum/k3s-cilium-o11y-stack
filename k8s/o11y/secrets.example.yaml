# ClickHouse credentials — copy to secrets.yaml and fill in.
#
#   cp secrets.example.yaml secrets.yaml
#
# secrets.yaml is gitignored. `make install` applies it before the Helm
# releases, because both the collector and Grafana mount keys from it:
#
#   OTEL_WRITER_PASSWORD  -> otelcol   (values/otel-collector.yaml, extraEnvs)
#   GRAFANA_PASSWORD      -> grafana   (values/grafana.yaml, envValueFrom)
#
# ClickHouse itself does NOT read this Secret. It authenticates against the
# SHA-256 hashes in manifests/clickhouse-users-override.yaml, so the two must
# be kept in sync — change a password here and you must regenerate its hash:
#
#   printf '%s' 'your-password' | sha256sum
#
# Generate passwords with:  openssl rand -base64 24
---
apiVersion: v1
kind: Secret
metadata:
  name: clickhouse-auth
  namespace: o11y
type: Opaque
stringData:
  # otel_writer — INSERT + CREATE TABLE on the `otel` database. Used by the
  # collector's clickhouse exporter, which creates the schema on first write.
  OTEL_WRITER_PASSWORD: "replace-me"

  # grafana — read-only across `otel`. Used by the ClickHouse datasource.
  GRAFANA_PASSWORD: "replace-me"
